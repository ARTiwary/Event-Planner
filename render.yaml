services:
  - type: web
    name: gather-event-planner
    runtime: node
    plan: free
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: GROQ_API_KEY
        sync: false          # paste it in the Render dashboard, never in git
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: TRUST_PROXY
        value: "1"           # Render sits behind a proxy; needed for per-user rate limits
